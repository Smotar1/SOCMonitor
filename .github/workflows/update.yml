name: update-data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python scripts/fetch.py
      - name: Commit changes
        run: |
          git config user.name "socmonitor-bot"
          git config user.email "socmonitor-bot@users.noreply.github.com"
          git add data/data.json
          if ! git diff --cached --quiet; then
            git commit -m "data update"
            git pull --rebase
            git push
          fi
